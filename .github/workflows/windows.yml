name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [windows-build]

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: tryswift/setup-swift@ce5fe39afee72fd792fabab6db8ec3005962daf7 # v1.2.0
        with:
          swift-version: "6.4.3"
          windows-toolchain-variant: noasserts
          windows-minimal: true
      - name: Check development toolchains
        shell: pwsh
        run: |
          swift --version
          dotnet --info
      - name: Retrieve the verified templates from the release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'readingpen-release-templates'
          New-Item -ItemType Directory -Path $stage | Out-Null
          gh release download v0.2.0 --repo '${{ github.repository }}' --pattern 'ReadingPenConverter-macOS-universal.zip' --dir $stage
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the release templates.' }
          $archive = Join-Path $stage 'ReadingPenConverter-macOS-universal.zip'
          if ((Get-FileHash -LiteralPath $archive).Hash -ne 'd66d3036b821716c749dacb55106b6a019d5ac27af4fbff03bab1d6edd1c0203') {
            throw 'The macOS release asset differs from the verified package.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
      - name: Build and validate the Windows release package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'readingpen-release-templates'
          $bnf = (Get-ChildItem -LiteralPath $stage -Filter 'target.bnf' -File -Recurse).FullName
          $bnl = (Get-ChildItem -LiteralPath $stage -Filter 'target.bnl' -File -Recurse).FullName
          ./scripts/build-windows.ps1 -Architecture '${{ matrix.arch }}' -TemplateBnf $bnf -TemplateBnl $bnl
      - name: Upload to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = gh release view v0.2.0 --repo '${{ github.repository }}' --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $state -ne 'true') { throw 'Release is not a draft.' }
          gh release upload v0.2.0 'dist/windows/ReadingPenConverter-windows-${{ matrix.arch }}.zip' --repo '${{ github.repository }}'
