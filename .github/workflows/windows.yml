name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [windows-build]

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: tryswift/setup-swift@ce5fe39afee72fd792fabab6db8ec3005962daf7 # v1.2.0
        with:
          swift-version: "6.4.3"
          windows-toolchain-variant: noasserts
          windows-minimal: true
      - name: Check development toolchains
        shell: pwsh
        run: |
          swift --version
          dotnet --info
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Architecture '${{ matrix.arch }}' -SkipTemplates
      - name: Stage build in private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-build-staging 'dist/windows/ReadingPenConverter-windows-${{ matrix.arch }}-without-templates.zip' --repo '${{ github.repository }}' --clobber
